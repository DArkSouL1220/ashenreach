<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ashenreach" />
    <meta name="theme-color" content="#05080f" />
    <meta name="description" content="Ashenreach – ein Echtzeit-Strategiespiel für Touch: Basisbau, Rohstoffe, Heldin und Armeen gegen die Hohle Legion." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="icon" href="./icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" />
    <title>Ashenreach</title>
  </head>
  <body>
    <script>
      // Frühe Fehleranzeige: läuft vor dem Spielmodul und fängt auch Lade-/Syntaxfehler.
      (function () {
        function box() {
          var el = document.getElementById('errbox');
          if (!el) {
            el = document.createElement('pre');
            el.id = 'errbox';
            el.style.cssText = 'position:fixed;left:8px;right:8px;top:60px;z-index:99;background:#5a1010;color:#fff;padding:8px;border-radius:8px;font:11px monospace;white-space:pre-wrap;max-height:40vh;overflow:auto';
            document.body.appendChild(el);
          }
          return el;
        }
        window.addEventListener('error', function (e) {
          box().textContent += (e.message || 'Fehler') + (e.lineno ? ' (Zeile ' + e.lineno + ')' : '') + '\n';
        });
        window.addEventListener('unhandledrejection', function (e) {
          box().textContent += String(e.reason) + '\n';
        });
      })();
    </script>
    <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f2d16b;font:600 18px system-ui,sans-serif;background:#05080f">Ashenreach lädt …</div>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
